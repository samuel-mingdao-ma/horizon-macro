name: Refresh HORIZON research
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'
permissions:
  contents: write
concurrency:
  group: horizon-data-refresh
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.3
      - name: Fetch, refit, and validate
        run: bash scripts/refresh-data.sh
      - name: Preserve research build
        uses: actions/upload-artifact@v4
        with:
          name: horizon-research
          path: |
            data/snapshot.json
            public/data/
            research/raw/
          retention-days: 30
      - name: Commit refreshed research to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json public/data research/raw
          if git diff --cached --quiet; then
            echo "No research changes."
          else
            git commit -m "Refresh macro data and research validation"
            git push
          fi
# This public repository is the scheduled research data origin.
# Production /api/macro checks its published snapshot hourly, without redeploying.
# Direct FRED refresh remains an optional transport fallback.
